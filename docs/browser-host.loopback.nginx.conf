# Serves the BUZZ_HOST=browser build and a loopback-only Buzz relay on one plain-HTTP
# origin, for relays reached through an SSH tunnel (e.g. team-builder installs).
# Listens on 127.0.0.1 only; never expose this server block on a public interface.
# Replace /srv/buzz-web and 127.0.0.1:3100 (the relay's --bind/--port).
server {
  listen 127.0.0.1:3180;
  server_name _;
  client_max_body_size 200m;
  root /srv/buzz-web;

  # Blocks injected scripts and data exfiltration ('wasm-unsafe-eval' is for the
  # WebP encoder worker). Required when users keep their
  # key in the page ("Use my key on this device"). Repeated per location because
  # nginx drops inherited add_header lines in a location that sets its own.
  # frame-src 'self' lets the Mission Control page frame <app>/dashboard/.
  set $buzz_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  # "/" is both the app and the relay: WebSocket upgrades and NIP-11 go to the relay.
  location = / {
    error_page 418 = @relay;
    if ($http_upgrade ~* websocket)                { return 418; }
    if ($http_accept ~* "application/nostr\+json") { return 418; }
    add_header Vary Accept always;
    add_header Cache-Control no-cache always;
    # Always a full response: a proxy that drops headers from a 304 would leave
    # browsers on an outdated Content-Security-Policy.
    etag off;
    if_modified_since off;
    add_header Content-Security-Policy $buzz_csp always;
    try_files /index.html =404;
  }

  # team-builder Mission Control for BUZZ_MISSION_CONTROL=1 builds (the app's
  # Mission Control page frames <app>/dashboard/). Mission Control sends its own
  # headers and checks the owner itself. Replace 127.0.0.1:3101 with
  # `team-builder dashboard enable --bind/--port`; delete this block otherwise.
  location /dashboard/ {
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header Host $http_host;
    proxy_read_timeout 300s;
  }

  location / {
    add_header Content-Security-Policy $buzz_csp always;
    try_files $uri @relay;
  }

  location @relay {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # $http_host keeps the advertised port (127.0.0.1:3102); $host would drop it
    # and the relay would reject the request.
    proxy_set_header Host $http_host;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_request_buffering off;
    proxy_buffering off;
  }
}
