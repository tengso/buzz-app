# Serves the BUZZ_HOST=browser build and the Buzz relay on one HTTPS origin.
# Replace buzz.example.com, the certificate paths, /srv/buzz-web and 127.0.0.1:3000.
server {
  listen 443 ssl;
  server_name buzz.example.com;
  ssl_certificate     /etc/ssl/buzz.example.com.crt;
  ssl_certificate_key /etc/ssl/buzz.example.com.key;
  client_max_body_size 200m;
  root /srv/buzz-web;

  # "/" is both the app and the relay: WebSocket upgrades and NIP-11 go to the relay.
  location = / {
    error_page 418 = @relay;
    if ($http_upgrade ~* websocket)                { return 418; }
    if ($http_accept ~* "application/nostr\+json") { return 418; }
    add_header Vary Accept always;
    add_header Cache-Control no-cache always;
    try_files /index.html =404;
  }

  # Built assets first; everything else (/query, /events, /count, /upload, /media/, ...) is the relay.
  location / {
    try_files $uri @relay;
  }

  location @relay {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1d;
    proxy_request_buffering off;
  }
}
