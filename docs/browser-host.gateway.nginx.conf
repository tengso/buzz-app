# Serves a BUZZ_PROXIED_RELAY_URL browser build plus a team-builder relay inside the
# LXD container, for browsers that reach it through a path-prefixed login gateway
# (https://et2.htisec.com/HaiChat/<app>/ -> cloud-VM nginx -> this server).
# The VM nginx strips the /<app>/ prefix, so this server only sees root paths.
# Replace /srv/buzz-web-gateway, 127.0.0.1:3100 (the relay's --bind/--port) and
# 127.0.0.1:3102 (the relay's advertised host:port).
server {
  # Reachable from the cloud VM only (LXD bridge); never expose it publicly.
  listen 3190;
  server_name _;
  client_max_body_size 200m;
  root /srv/buzz-web-gateway;

  # Blocks injected scripts and data exfiltration ('wasm-unsafe-eval' is for the
  # WebP encoder worker). Required when users keep their
  # key in the page ("Use my key on this device"). Repeated per location because
  # nginx drops inherited add_header lines in a location that sets its own.
  set $buzz_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

  # "/" is both the app and the relay: WebSocket upgrades and NIP-11 go to the relay.
  location = / {
    error_page 418 = @relay;
    if ($http_upgrade ~* websocket)                { return 418; }
    if ($http_accept ~* "application/nostr\+json") { return 418; }
    add_header Vary Accept always;
    add_header Cache-Control no-cache always;
    add_header Content-Security-Policy $buzz_csp always;
    try_files /index.html =404;
  }

  location / {
    add_header Content-Security-Policy $buzz_csp always;
    try_files $uri @relay;
  }

  location @relay {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # The relay finds its community, and checks NIP-42/NIP-98 signatures, by its
    # advertised host, whatever host the gateway or VM proxy sent.
    proxy_set_header Host 127.0.0.1:3102;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_request_buffering off;
    proxy_buffering off;
  }
}
